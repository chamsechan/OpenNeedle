<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">OpenNeedle — packed CPU inference and measured decode throughput</title>
<desc id="desc">Conceptual packed projection data flow. Expanded suite on a 4-core ARM Neoverse-N1 CPU: official 493.70, OpenNeedle SDOT plus INT8 KV 402.38 tokens per second. Sixteen queries, five repeats for OpenNeedle; official is from an earlier five-repeat run. Timing definitions differ; SDOT and INT8 KV add quantization error. Motion is illustrative.</desc>
<metadata>{&quot;source&quot;: &quot;reports/README.md&quot;, &quot;sha256&quot;: &quot;07d0f0c24e2f5d88f37864529c96228659303613a6f44b066df11b3caa031683&quot;, &quot;theme&quot;: &quot;dark&quot;, &quot;static&quot;: true}</metadata>
