<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">OpenNeedle — packed CPU inference and measured decode throughput</title>
<desc id="desc">Conceptual packed GEMV data flow. On a 4-core ARM Neoverse-N1 CPU: official 504.70, OpenNeedle SDOT 152.30, OpenNeedle FP32 124.40, and PyTorch 9.43 tokens per second. Medians of three queries repeated five times. Application timing definitions differ; SDOT adds quantization error. Motion is illustrative.</desc>
<metadata>{&quot;source&quot;: &quot;reports/backend_comparison.json&quot;, &quot;sha256&quot;: &quot;f471de20cc15750c0fd13c34762b6da8a20ea8547915519d0f6bf3e532b68348&quot;, &quot;theme&quot;: &quot;dark&quot;, &quot;static&quot;: true}</metadata>
