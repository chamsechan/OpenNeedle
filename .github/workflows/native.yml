name: Native correctness
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Apple OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install '.[test]'
      - name: Compile the native library
        run: python -m needle2 build-native
      - name: Compare native execution and grammar with references
        run: python -m pytest -q -s tests/test_native_build.py tests/test_native.py tests/test_optimized_attention_prefill.py tests/test_sdot_row4.py tests/test_grammar.py tests/test_dfa_equivalence.py tests/test_runtime_regressions.py
